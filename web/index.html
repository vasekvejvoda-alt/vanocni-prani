<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vánoční přání</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4334'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e9c46a'/%3E%3C/svg%3E">
<style>
/* Rozvržení: jeden sloupec do 760 px; dopis je „papír“, přání jsou řádky pod ním. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --paper: #fbfaf4; --line: #dfe4dd;
  --fg: #17241d; --muted: #5d6b63;
  --pine: #1d4334; --pine-fg: #ffffff; --pine-soft: #e3ece6;
  --berry: #a3271f; --berry-soft: #f6e4e1;
  --gold: #8a6410; --gold-soft: #f6ecd0;
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101814; --surface: #18231d; --paper: #1d2a23; --line: #2c3b33;
    --fg: #e8eee9; --muted: #9baba2;
    --pine: #7cc4a0; --pine-fg: #0d1a14; --pine-soft: #1f3329;
    --berry: #ef8f86; --berry-soft: #3a211f;
    --gold: #e9c46a; --gold-soft: #3a3118;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
header.top { background: var(--pine); color: var(--pine-fg); }
header.top .wrap { padding-block: 14px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.brand { font: 600 1.25rem var(--serif); letter-spacing: .01em; margin-right: auto; color: inherit; text-decoration: none; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav a { color: inherit; text-decoration: none; padding: 6px 12px; border-radius: 999px; opacity: .8; }
nav a:hover { opacity: 1; }
nav a.on { background: color-mix(in srgb, var(--pine-fg) 18%, transparent); opacity: 1; font-weight: 600; }
main { padding-top: 24px; display: flex; flex-direction: column; gap: 20px; }
h1 { font: 600 1.7rem/1.2 var(--serif); margin: 0; text-wrap: balance; }
h2 { font: 600 1.15rem/1.3 var(--serif); margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }

button, .btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 9px 16px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; display: inline-block; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--pine); border-color: var(--pine); color: var(--pine-fg); }
button.primary:hover { filter: brightness(1.1); }
button.quiet { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px; font-weight: 500; }
button.quiet:hover { color: var(--fg); text-decoration: underline; }
button.danger:hover { color: var(--berry); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; width: 100%; }
textarea { min-height: 9em; resize: vertical; font-family: var(--serif); line-height: 1.6; }
label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .9rem; }
label span.opt { font-weight: 400; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
a.letter { display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
a.letter:hover { border-color: var(--pine); }
a.letter .name { font: 600 1.2rem var(--serif); overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 3px; background: var(--pine-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pine); }
.tag { display: inline-block; font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; background: var(--pine-soft); color: var(--pine); white-space: nowrap; }
.tag.taken { background: var(--berry-soft); color: var(--berry); }
.tag.mine { background: var(--gold-soft); color: var(--gold); }

.paper { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px;
  font: 1.08rem/1.7 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; }
.note { background: var(--gold-soft); color: var(--fg); border-radius: var(--radius); padding: 12px 16px; }
.note.err { background: var(--berry-soft); }
ul.wishes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.wishes li { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
ul.wishes li:first-child { border-top: 0; }
.wish { flex: 1 1 240px; min-width: 0; overflow-wrap: anywhere; }
.wish .t { font-weight: 600; }
.wish.gone .t { text-decoration: line-through; color: var(--muted); }
.wish a { color: var(--pine); }
.center { max-width: 460px; margin: 8vh auto 0; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px);
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 5; }
.linkbox { font: .8rem ui-monospace, monospace; }
</style>
</head>
<body>
<div id="app"><div class="wrap"><main><p class="muted">Načítám…</p></main></div></div>
<div id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);

const cfg = window.CONFIG || {};
if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY || !window.supabase) {
  $app.innerHTML = `<div class="wrap"><main class="center stack"><h1>Aplikace ještě není propojená</h1>
    <p>V souboru <code>config.js</code> chybí adresa a klíč databáze. Postup je v souboru NAVOD.md.</p></main></div>`;
  return;
}
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);

const S = { me: null, members: [], letters: [], wishes: [], states: new Map(), admin: null, edit: null, busy: false };

// ───────── pomocné ─────────
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3500);
}
function errText(e) {
  const m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Nepodařilo se spojit se serverem. Zkuste to za chvíli znovu.";
  if (/anonymous sign-ins are disabled/i.test(m)) return "V Supabase není zapnuté anonymní přihlášení (viz NAVOD.md, krok 3).";
  return m;
}
async function q(promise) {           // rozbalí odpověď Supabase, chybu vyhodí
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}
async function ensureSession() {
  const { data } = await sb.auth.getSession();
  if (!data.session) await q(sb.auth.signInAnonymously());
}
function inviteToken() {
  const m = location.hash.match(/pozvanka=([0-9a-f]{20,})/i);
  return m ? m[1] : null;
}
const inviteLink = token => location.origin + location.pathname + "#pozvanka=" + token;

// ───────── data ─────────
async function loadAll() {
  const [members, letters, wishes, states] = await Promise.all([
    q(sb.from("members").select("id,name,is_admin").order("name")),
    q(sb.from("letters").select("*").order("created_at")),
    q(sb.from("wishes").select("*").order("created_at")),
    q(sb.rpc("wish_states")),
  ]);
  S.members = members; S.letters = letters; S.wishes = wishes;
  S.states = new Map(states.map(s => [s.wish_id, s]));
  if (S.me.is_admin) S.admin = await q(sb.rpc("admin_members"));
}
const isOwn = l => l.recipient_member === S.me.id;
const canEdit = l => l.created_by === S.me.id || S.me.is_admin;
const liveWishes = l => S.wishes.filter(w => w.letter_id === l.id && !w.deleted_at);

// ───────── start ─────────
async function boot() {
  try {
    const token = inviteToken();
    if (token) {
      await ensureSession();
      await q(sb.rpc("redeem_invite", { p_token: token }));
      history.replaceState(null, "", location.pathname + "#/");
    }
    const st = await q(sb.rpc("app_state"));
    if (st.me) { S.me = st.me; await loadAll(); render(); return; }
    st.has_members ? renderGate() : renderSetup();
  } catch (e) { renderGate(errText(e)); }
}

function shell(inner) { return `<div class="wrap"><main class="center stack">${inner}</main></div>`; }

function renderGate(error) {
  $app.innerHTML = shell(`<h1>Vánoční přání</h1>
    ${error ? `<p class="note err">${esc(error)}</p>` : ""}
    <p>Sem se chodí přes osobní pozvánku. Otevřete odkaz, který jste dostali, nebo ho vložte sem:</p>
    <form id="gate" class="stack"><label>Odkaz z pozvánky<input id="gate-link" required autocomplete="off"></label>
    <button class="primary">Vstoupit</button></form>`);
  document.getElementById("gate").onsubmit = ev => {
    ev.preventDefault();
    const m = document.getElementById("gate-link").value.match(/[0-9a-f]{20,}/i);
    if (!m) return toast("V tomhle textu pozvánka není.");
    location.hash = "pozvanka=" + m[0]; location.reload();
  };
}
function renderSetup() {
  $app.innerHTML = shell(`<h1>Založit rodinné Vánoce</h1>
    <p>Aplikace je zatím prázdná. Kdo ji založí, stane se správcem: bude zvát ostatní a rozdávat jim pozvánky.</p>
    <form id="setup" class="stack"><label>Vaše jméno, jak ho uvidí rodina<input id="setup-name" required maxlength="60" placeholder="např. Vašek"></label>
    <button class="primary">Založit</button></form>`);
  document.getElementById("setup").onsubmit = async ev => {
    ev.preventDefault();
    try {
      await ensureSession();
      await q(sb.rpc("bootstrap", { p_name: document.getElementById("setup-name").value }));
      location.hash = "#/rodina"; location.reload();
    } catch (e) { toast(errText(e)); }
  };
}

// ───────── obrazovky ─────────
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [page, id] = h.split("/");
  return { page: page || "", id };
}

function render() {
  const r = route();
  const nav = [["", "Dopisy"], ["moje", "Moje dárky"]];
  if (S.me.is_admin) nav.push(["rodina", "Rodina"]);
  const active = r.page === "dopis" || r.page === "novy" ? "" : r.page;
  let body;
  if (r.page === "dopis") body = viewLetter(r.id);
  else if (r.page === "novy") body = viewNew(r.id);
  else if (r.page === "moje") body = viewMine();
  else if (r.page === "rodina" && S.me.is_admin) body = viewFamily();
  else body = viewHome();
  $app.innerHTML = `<header class="top"><div class="wrap">
      <a class="brand" href="#/">Vánoční přání</a>
      <nav>${nav.map(([p, t]) => `<a href="#/${p}" class="${p === active ? "on" : ""}">${t}</a>`).join("")}</nav>
    </div></header>
    <div class="wrap"><main>${body}
      <p class="small muted row spread"><span>Přihlášen(a): ${esc(S.me.name)}</span>
      <button class="quiet" data-act="logout">Odhlásit toto zařízení</button></p>
    </main></div>`;
}

function viewHome() {
  const mineLetter = S.letters.find(isOwn);
  const cards = S.letters.map(l => {
    const ws = liveWishes(l);
    let info;
    if (isOwn(l)) {
      info = `<span class="small muted">${ws.length} ${plural(ws.length, "přání", "přání", "přání")} · co je zabrané, nevidíte</span>`;
    } else {
      const free = ws.filter(w => !S.states.get(w.id)?.taken).length;
      const pct = ws.length ? Math.round(100 * (ws.length - free) / ws.length) : 0;
      info = ws.length
        ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
           <span class="small muted">${free === 0 ? "vše rozebráno" : `${free} ${plural(free, "volné přání", "volná přání", "volných přání")}`}</span>`
        : `<span class="small muted">zatím bez přání</span>`;
    }
    const tag = isOwn(l) ? `<span class="tag mine">váš dopis</span>` : (!l.recipient_member ? `<span class="tag">dítě</span>` : "");
    return `<a class="letter" href="#/dopis/${l.id}"><span class="row spread"><span class="name">${esc(l.recipient_name)}</span>${tag}</span>${info}</a>`;
  }).join("");
  return `<div class="row spread"><h1>Dopisy Ježíškovi</h1>
      <span class="row">${mineLetter ? "" : `<a class="btn primary" href="#/novy/ja">Napsat svůj dopis</a>`}
      <a class="btn" href="#/novy/dite">Přidat dopis dítěte</a></span></div>
    ${S.letters.length ? `<div class="letters">${cards}</div>`
      : `<p class="card muted">Zatím tu není žádný dopis. Napište svůj, nebo přidejte dopis dítěte.</p>`}
    <p class="small muted">U cizích dopisů vidíte jen to, co je ještě volné. Co si někdo vybere, ostatním zmizí. U svého dopisu se nedozvíte nic – ať zůstane překvapení.</p>`;
}

function viewNew(kind) {
  const child = kind !== "ja";
  return `<p><a href="#/" class="muted">← Dopisy</a></p>
    <h1>${child ? "Dopis dítěte" : "Váš dopis Ježíškovi"}</h1>
    <form class="stack card" data-form="new-letter" data-child="${child ? 1 : ""}">
      ${child ? `<label>Jméno dítěte<input id="nl-name" required maxlength="60"></label>` : ""}
      <label>Text dopisu <span class="opt">nepovinné – můžete ho opsat tak, jak ho dítě napsalo</span>
        <textarea id="nl-body" placeholder="Milý Ježíšku, …"></textarea></label>
      <p class="small muted">${child
        ? "Dopis budete spravovat vy. Uvidíte u něj, co je zabrané, a sami si z něj můžete vybírat."
        : "Jednotlivá přání přidáte v dalším kroku. Kdo si co vybere, se nedozvíte."}</p>
      <div class="row"><button class="primary">Pokračovat k přáním</button></div>
    </form>`;
}

function wishMeta(w) {
  const u = safeUrl(w.url);
  return `${w.note ? `<div class="small muted">${esc(w.note)}</div>` : ""}
          ${u ? `<div class="small"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Odkaz na dárek ↗</a></div>` : ""}`;
}

function viewLetter(id) {
  const l = S.letters.find(x => x.id === id);
  if (!l) return `<p><a href="#/" class="muted">← Dopisy</a></p><p class="card">Tenhle dopis už neexistuje.</p>`;
  const own = isOwn(l), edit = canEdit(l), ws = liveWishes(l);
  const editingLetter = S.edit === "letter:" + l.id;

  // cizí zabrané dárky mizí; vidí je jen ten, kdo si je vybral, a kdo dopis vložil (aby ho mohl spravovat)
  const mineToManage = l.created_by === S.me.id;
  const shown = ws.filter(w => { const st = S.states.get(w.id); return own || mineToManage || !st?.taken || st.mine; });
  const rows = shown.map(w => {
    if (S.edit === "wish:" + w.id) return `<li>${wishForm(w)}</li>`;
    const st = S.states.get(w.id);
    let status = "";
    if (!own) {
      status = st?.mine ? `<span class="tag mine">vybrali jste vy</span><button data-act="unclaim" data-id="${w.id}">Vrátit</button>`
        : st?.taken ? `<span class="tag taken">zabrané</span>`
        : `<button class="primary" data-act="claim" data-id="${w.id}">Vyberu si to</button>`;
    }
    const tools = edit ? `<button class="quiet" data-act="edit" data-id="wish:${w.id}">Upravit</button>
                          <button class="quiet danger" data-act="del-wish" data-id="${w.id}">Odebrat</button>` : "";
    return `<li><div class="wish"><div class="t">${esc(w.title)}</div>${wishMeta(w)}</div><span class="row">${status}${tools}</span></li>`;
  }).join("");

  return `<p><a href="#/" class="muted">← Dopisy</a></p>
    <div class="row spread"><h1>${esc(l.recipient_name)}</h1>
      <span class="row">${edit && !editingLetter ? `<button data-act="edit" data-id="letter:${l.id}">Upravit dopis</button>` : ""}
      ${S.me.is_admin ? `<button class="quiet danger" data-act="del-letter" data-id="${l.id}">Smazat dopis</button>` : ""}</span></div>
    ${own ? `<p class="note">Tohle je váš dopis. Ostatní z něj vybírají, ale co je zabrané, tu neuvidíte.</p>` : ""}
    ${editingLetter ? `<form class="stack card" data-form="letter" data-id="${l.id}">
        ${own ? "" : `<label>Jméno<input id="el-name" required maxlength="60" value="${esc(l.recipient_name)}"></label>`}
        <label>Text dopisu<textarea id="el-body">${esc(l.body)}</textarea></label>
        <div class="row"><button class="primary">Uložit</button><button type="button" data-act="cancel">Zrušit</button></div></form>`
      : (l.body.trim() ? `<div class="paper">${esc(l.body)}</div>` : "")}
    <section class="card stack"><h2>Přání</h2>
      ${shown.length ? `<ul class="wishes">${rows}</ul>` : `<p class="muted">${ws.length ? "Všechno už je rozebrané." : edit ? "Zatím žádné. Přidejte první níže." : "Zatím tu žádná přání nejsou."}</p>`}
    </section>
    ${edit ? `<section class="card stack"><h2>Přidat přání</h2>${wishForm(null, l.id)}</section>` : ""}`;
}

function wishForm(w, letterId) {
  const p = w ? "ew" : "nw";
  return `<form class="stack" style="flex:1 1 100%" data-form="wish" data-id="${w ? w.id : ""}" data-letter="${letterId || ""}">
    <label>Co si přeje<input id="${p}-title" required maxlength="200" value="${esc(w?.title)}" placeholder="např. Lego hasiči"></label>
    <label>Upřesnění <span class="opt">nepovinné – velikost, barva, kde to mají</span><input id="${p}-note" maxlength="500" value="${esc(w?.note)}"></label>
    <label>Odkaz <span class="opt">nepovinné</span><input id="${p}-url" type="url" maxlength="1000" value="${esc(w?.url)}" placeholder="https://"></label>
    <div class="row"><button class="primary">${w ? "Uložit" : "Přidat přání"}</button>
    ${w ? `<button type="button" data-act="cancel">Zrušit</button>` : ""}</div></form>`;
}

function viewMine() {
  const mine = S.wishes.filter(w => S.states.get(w.id)?.mine);
  const groups = S.letters.map(l => [l, mine.filter(w => w.letter_id === l.id)]).filter(([, ws]) => ws.length);
  return `<h1>Moje dárky</h1>
    <p class="muted">Co jste si vybrali, že koupíte. Vidíte to jen vy.</p>
    ${groups.length ? groups.map(([l, ws]) => `<section class="card stack"><h2>Pro: ${esc(l.recipient_name)}</h2>
      <ul class="wishes">${ws.map(w => `<li><div class="wish ${w.deleted_at ? "gone" : ""}"><div class="t">${esc(w.title)}</div>${wishMeta(w)}
        ${w.deleted_at ? `<div class="small">Autor dopisu tohle přání mezitím odebral.</div>` : ""}</div>
        <button data-act="unclaim" data-id="${w.id}">Vrátit</button></li>`).join("")}</ul></section>`).join("")
      : `<p class="card muted">Zatím jste si nic nevybrali. Otevřete některý dopis a klikněte na „Vyberu si to“.</p>`}`;
}

function viewFamily() {
  const rows = (S.admin || []).map(m => `<li><div class="wish"><div class="t">${esc(m.name)} ${m.is_admin ? `<span class="tag">správce</span>` : ""}</div>
      <div class="small muted">${m.signed_in ? "už se přihlásil(a)" : "pozvánku ještě neotevřel(a)"}</div>
      <input class="linkbox" readonly aria-label="Pozvánka pro ${esc(m.name)}" value="${esc(inviteLink(m.invite_token))}" onfocus="this.select()"></div>
      <span class="row"><button class="primary" data-act="copy" data-id="${m.invite_token}">Kopírovat pozvánku</button>
      <button class="quiet" data-act="reset" data-id="${m.id}">Nová pozvánka</button>
      ${m.id === S.me.id ? "" : `<button class="quiet danger" data-act="remove" data-id="${m.id}">Odebrat</button>`}</span></li>`).join("");
  return `<h1>Rodina</h1>
    <p class="note">Pozvánka je osobní klíč: kdo má odkaz, vstoupí jako daný člověk. Posílejte ji každému zvlášť (SMS, WhatsApp, e-mail).
      Tu svoji si uložte – budete ji potřebovat na dalším zařízení.</p>
    <section class="card"><ul class="wishes">${rows}</ul></section>
    <section class="card stack"><h2>Pozvat dalšího člena</h2>
      <form class="row" data-form="member"><input id="nm-name" required maxlength="60" placeholder="Jméno, např. Babička" style="flex:1 1 200px" aria-label="Jméno nového člena">
      <button class="primary">Vytvořit pozvánku</button></form>
      <p class="small muted">Děti, které ještě věří, sem nezvěte – jejich dopis přidá rodič na stránce Dopisy.</p></section>`;
}

// ───────── akce ─────────
async function act(fn, okMsg) {
  if (S.busy) return;
  S.busy = true;
  let goTo = null;
  try { goTo = (await fn()) || null; if (okMsg) toast(okMsg); }
  catch (e) { toast(errText(e)); }
  finally {
    S.busy = false;
    try { await loadAll(); } catch (_) {}
    if (goTo && location.hash !== goTo) location.hash = goTo;   // překreslí se přes hashchange
    else render();
  }
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (!b || !S.me) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case "claim": return act(async () => { await q(sb.rpc("claim_wish", { p_wish: id })); }, "Máte to. Najdete to v „Moje dárky“.");
    case "unclaim": return act(async () => { await q(sb.rpc("unclaim_wish", { p_wish: id })); }, "Vráceno, dárek je zase volný.");
    case "edit": S.edit = id; return render();
    case "cancel": S.edit = null; return render();
    case "del-wish":
      if (!confirm("Odebrat tohle přání z dopisu?")) return;
      return act(async () => { await q(sb.from("wishes").update({ deleted_at: new Date().toISOString() }).eq("id", id)); });
    case "del-letter":
      if (!confirm("Smazat celý dopis i se všemi přáními? Kdo si z něj už vybral, o svůj výběr přijde.")) return;
      return act(async () => { await q(sb.from("letters").delete().eq("id", id)); return "#/"; });
    case "copy": {
      const link = inviteLink(id);
      return navigator.clipboard.writeText(link).then(() => toast("Pozvánka zkopírována."),
        () => toast("Kopírování se nepovedlo – označte odkaz ručně."));
    }
    case "reset":
      if (!confirm("Vytvořit novou pozvánku? Ta stará přestane platit a člen bude odhlášen.")) return;
      return act(async () => { await q(sb.rpc("reset_invite", { p_member: id })); }, "Nová pozvánka je připravená.");
    case "remove":
      if (!confirm("Odebrat člena? Zmizí i jeho dopis a dárky, které si vybral, se uvolní.")) return;
      return act(async () => { await q(sb.rpc("remove_member", { p_member: id })); });
    case "logout":
      if (!confirm("Odhlásit? Zpátky se dostanete jen přes svou pozvánku.")) return;
      return sb.auth.signOut().then(() => location.reload());
  }
});

document.addEventListener("submit", ev => {
  const f = ev.target.closest("[data-form]");
  if (!f || !S.me) return;
  ev.preventDefault();
  const val = id => (document.getElementById(id)?.value || "").trim();
  switch (f.dataset.form) {
    case "new-letter": {
      const child = !!f.dataset.child;
      return act(async () => {
        const row = await q(sb.from("letters").insert({
          recipient_name: child ? val("nl-name") : S.me.name, body: val("nl-body"),
          recipient_member: child ? null : S.me.id, created_by: S.me.id,
        }).select().single());
        return "#/dopis/" + row.id;
      });
    }
    case "letter": {
      const patch = { body: val("el-body") };
      if (document.getElementById("el-name")) patch.recipient_name = val("el-name");
      return act(async () => { await q(sb.from("letters").update(patch).eq("id", f.dataset.id)); S.edit = null; }, "Uloženo.");
    }
    case "wish": {
      const p = f.dataset.id ? "ew" : "nw";
      const data = { title: val(p + "-title"), note: val(p + "-note"), url: val(p + "-url") };
      return act(async () => {
        if (f.dataset.id) await q(sb.from("wishes").update(data).eq("id", f.dataset.id));
        else await q(sb.from("wishes").insert({ ...data, letter_id: f.dataset.letter }));
        S.edit = null;
      }, f.dataset.id ? "Uloženo." : "Přání přidáno.");
    }
    case "member":
      return act(async () => { await q(sb.rpc("add_member", { p_name: val("nm-name") })); }, "Pozvánka vytvořena – zkopírujte ji a pošlete.");
  }
});

window.addEventListener("hashchange", () => {
  if (inviteToken()) return location.reload();
  if (S.me) { S.edit = null; render(); window.scrollTo(0, 0); }
});
// když se člověk vrátí na záložku, načti čerstvý stav (pokud zrovna nic nepíše)
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || !S.me || S.busy) return;
  if (S.edit || /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) return;
  try { await loadAll(); render(); } catch (_) {}
});

boot();
})();
</script>
</body>
</html>
